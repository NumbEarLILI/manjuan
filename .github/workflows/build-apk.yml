name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          sdkroot="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "sdkroot=$sdkroot"
          if [ -x "$sdkroot/cmdline-tools/latest/bin/sdkmanager" ]; then
            sdkmanager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          else
            sdkmanager="$(find "$sdkroot" -name sdkmanager -type f | sort | tail -1)"
          fi
          test -n "$sdkmanager"
          echo "sdkmanager=$sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Package downloadable APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          src="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$src"
          cp "$src" dist/manjuan-debug.apk
          cp "$src" dist/manjuan.apk
          cp "$src" "dist/漫卷.apk"
          ls -lh dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: manjuan-apk
          path: |
            dist/manjuan-debug.apk
            dist/manjuan.apk
            dist/漫卷.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish prerelease
    needs: apk
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: manjuan-apk
          path: dist

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="manjuan-apk-20260923"
          title="漫卷 APK（初版）"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          notes_file="$(mktemp)"
          cat > "$notes_file" <<EOF
          #1 已合并到 main。本地导入和 WebDAV 书库都可以用。

          支持 TXT、EPUB、MOBI、AZW3、PDF、CBZ、CBR 和图片 ZIP。安装包是调试构建，使用仓库内固定的 CI 密钥签名，供侧载试用。同一密钥打出来的包可以互相覆盖安装。手机里如果还是更早的随机调试签名包，需要先卸载一次。

          本次构建：${run_url}
          EOF

          debug_apk="$(find dist -name 'manjuan-debug.apk' -print -quit)"
          named_apk="$(find dist -name 'manjuan.apk' -print -quit)"
          test -n "$debug_apk"
          test -n "$named_apk"
          ls -lh "$debug_apk" "$named_apk"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              "$debug_apk" \
              "${named_apk}#漫卷.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --latest=false \
              --title "$title" \
              --target "$GITHUB_SHA" \
              --notes-file "$notes_file"
          else
            gh release create "$tag" \
              "$debug_apk" \
              "${named_apk}#漫卷.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --latest=false \
              --title "$title" \
              --target "$GITHUB_SHA" \
              --notes-file "$notes_file"
          fi

          gh release view "$tag" --repo "$GITHUB_REPOSITORY"
